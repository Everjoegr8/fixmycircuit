name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: End-to-end test in Electron
        run: xvfb-run -a npm run test:e2e

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle scrcpy (Apache-2.0) for the phone mirror tab
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Latest official release, verified against the SHA-256 GitHub publishes for the file
          # (the asset digest, or the release's SHA256SUMS file).
          $h = @{ 'User-Agent' = 'fixmycircuit-ci'; 'Authorization' = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod "https://api.github.com/repos/Genymobile/scrcpy/releases/latest" -Headers $h
          $asset = $rel.assets | Where-Object { $_.name -match '^scrcpy-win64-v[\d.]+\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'No scrcpy win64 zip in the latest release' }
          Invoke-WebRequest $asset.browser_download_url -OutFile scrcpy.zip
          $hash = (Get-FileHash scrcpy.zip -Algorithm SHA256).Hash.ToLower()
          $want = if ($asset.digest) { $asset.digest -replace '^sha256:', '' } else { '' }
          if (-not $want) {
            $sums = $rel.assets | Where-Object { $_.name -match 'sha256' } | Select-Object -First 1
            if ($sums) { $txt = (Invoke-WebRequest $sums.browser_download_url).Content; if ($txt -is [byte[]]) { $txt = [Text.Encoding]::UTF8.GetString($txt) }; $m = [regex]::Match($txt, '(?im)^([0-9a-f]{64})\s+\*?' + [regex]::Escape($asset.name)); if ($m.Success) { $want = $m.Groups[1].Value } }
          }
          if (-not $want) { throw "No published checksum found for $($asset.name)" }
          if ($want.ToLower() -ne $hash) { throw "scrcpy checksum mismatch: got $hash, expected $want" }
          Write-Host "$($asset.name) SHA-256 verified: $hash"
          Expand-Archive scrcpy.zip -DestinationPath scrcpy-tmp
          $top = Get-ChildItem scrcpy-tmp | Select-Object -First 1
          Copy-Item "$($top.FullName)/*" vendor/scrcpy/ -Recurse
          if (!(Test-Path vendor/scrcpy/scrcpy.exe)) { throw 'scrcpy.exe missing' }
      - name: Build Windows installer and portable .exe
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: FixMyCircuit-windows
          path: |
            release/*.exe
          if-no-files-found: error

  release:
    # Every push to main publishes (or refreshes) a GitHub Release named after
    # the version in package.json, with the Windows installer and portable .exe.
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: FixMyCircuit-windows
          path: dist-win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FixMyCircuit ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist-win/*.exe
          body: |
            Free offline repair workbench for phone technicians.

            First launch opens a demo workshop (Tecno Camon 20 Pro, Infinix Note 30, Samsung Galaxy A32, iPhone 12 Pro) built on one synthetic sample board, so every feature can be tried right away. Remove it from Home or Settings.

            - **FixMyCircuit Setup ${{ steps.version.outputs.version }}.exe**: installer (choose folder, creates a desktop shortcut)
            - **FixMyCircuit ${{ steps.version.outputs.version }}.exe**: portable, runs without installing

            Windows may show a SmartScreen warning because the app is not code-signed yet: click "More info" then "Run anyway".

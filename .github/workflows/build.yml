name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: End-to-end test in Electron
        run: xvfb-run -a npm run test:e2e

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows installer and portable .exe
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: FixMyCircuit-windows
          path: |
            release/*.exe
          if-no-files-found: error

  release:
    # Every push to main publishes (or refreshes) a GitHub Release named after
    # the version in package.json, with the Windows installer and portable .exe.
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: FixMyCircuit-windows
          path: dist-win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FixMyCircuit ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist-win/*.exe
          body: |
            Free offline repair workbench for phone technicians.

            - **FixMyCircuit Setup ${{ steps.version.outputs.version }}.exe**: installer (choose folder, creates a desktop shortcut)
            - **FixMyCircuit ${{ steps.version.outputs.version }}.exe**: portable, runs without installing

            Windows may show a SmartScreen warning because the app is not code-signed yet: click "More info" then "Run anyway".
